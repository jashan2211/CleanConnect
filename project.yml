name: CleanConnect
options:
  bundleIdPrefix: ca.thebighead
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: F385ZL83XQ
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.8.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.1.0

targets:
  CleanConnect:
    type: application
    platform: iOS
    sources:
      - path: CleanConnect
        excludes:
          - "Core/Demo/DemoAssets.xcassets"
      - path: CleanConnect/Core/Demo/DemoAssets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.thebighead.cleanconnect
        PRODUCT_NAME: CleanConnect
        INFOPLIST_FILE: CleanConnect/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CleanConnect/Resources/CleanConnect.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "DemoAssets.xcassets"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleSignIn
        product: GoogleSignIn

schemes:
  CleanConnect:
    build:
      targets:
        CleanConnect: all
    run:
      config: Debug
    archive:
      config: Release
